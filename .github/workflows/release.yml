name: Prepare draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate tag before building
        run: bun run release:verify --version-only
      - run: bun run setup
      - run: bun run test
      - run: bun run package
      - run: bun run release:verify
      - name: Prepare release notes
        shell: pwsh
        run: |
          @'
          Download the portable ZIP or the per-user installer for Windows 10/11 x64.
          WebView2 Runtime is required. Binaries are unsigned.
          Verify downloads using the attached SHA-256 manifest.
          See CHANGELOG.md and docs/user-guide.md in the tagged source for details.
          '@ | Set-Content release-notes.txt
      - name: Create draft for review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $artifacts = @("dist/EarControl-$version-win-x64.zip", "dist/EarControl_$($version)_x64-setup.exe", "dist/EarControl-$version-SHA256SUMS.txt")
          gh release create $env:GITHUB_REF_NAME @artifacts --verify-tag --draft --title "EarControl $version" --notes-file release-notes.txt
