name: Prepare draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate tag before building
        shell: pwsh
        run: ./scripts/verify-release.ps1 -VersionOnly
      - name: Test
        shell: pwsh
        run: ./scripts/windows.ps1 -Task Test
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Package and verify
        shell: pwsh
        run: |
          ./scripts/windows.ps1 -Task Package
          ./scripts/verify-release.ps1
      - name: Test clean install and 2.1.2 migration
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/test-installer.ps1 -DisposableVm
      - name: Prepare release notes
        shell: pwsh
        run: |
          @'
          Download the portable ZIP or per-user installer for Windows 10/11 x64.
          The native Rust app needs no WebView2, Bun, Node, .NET or Rust runtime installation.
          If 2.x is installed, uninstall it first with Delete app data unchecked. Then install 3.0. Your profiles carry over.
          Binaries are unsigned. Verify downloads using the attached SHA-256 manifest.
          See CHANGELOG.md and docs/user-guide.md in the tagged source for details.
          '@ | Set-Content release-notes.txt
      - name: Create draft for review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content desktop/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $artifacts = @("dist/EarControl-$version-win-x64.zip", "dist/EarControl_$($version)_x64-setup.exe", "dist/EarControl-$version-SHA256SUMS.txt")
          gh release create $env:GITHUB_REF_NAME @artifacts --verify-tag --draft --title "EarControl $version" --notes-file release-notes.txt
