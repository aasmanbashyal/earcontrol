name: Windows checks and package
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format and lint
        shell: pwsh
        run: ./scripts/windows.ps1 -Task Check
      - name: Test
        shell: pwsh
        run: ./scripts/windows.ps1 -Task Test
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Package
        shell: pwsh
        run: ./scripts/windows.ps1 -Task Package
      - name: Verify release artifacts
        shell: pwsh
        run: ./scripts/verify-release.ps1
      - name: Test clean install and 2.1.2 migration
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/test-installer.ps1 -DisposableVm
      - uses: actions/upload-artifact@v4
        with:
          name: EarControl-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
