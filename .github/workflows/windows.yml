name: Windows checks and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked frontend dependencies
        run: bun run setup
      - name: Test
        shell: pwsh
        run: bun run test
      - name: Build portable app and installer
        shell: pwsh
        run: bun run package
      - name: Verify release artifacts
        run: bun run release:verify
      - uses: actions/upload-artifact@v4
        with:
          name: EarControl-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
