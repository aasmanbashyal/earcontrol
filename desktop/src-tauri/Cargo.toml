[package]
name = "earcontrol"
version = "2.1.2"
description = "Headphone controls, shortcuts, and macros for Windows"
edition = "2021"
license = "MIT"
default-run = "earcontrol"

[lib]
name = "earcontrol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
windows = { version = "0.62", features = [
  "Foundation", "Media",
  "Win32_Foundation", "Win32_Devices_Bluetooth", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"
] }

[dev-dependencies]
windows = { version = "0.62", features = ["Foundation_Collections", "Media_Control"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
